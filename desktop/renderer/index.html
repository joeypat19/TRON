<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRON</title>
    <link rel="icon" type="image/png" href="./tron-logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="chrome-header">
        <button class="tab-search" id="tab-search" type="button" aria-label="Search tabs" title="Search tabs"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"></path></svg></button>
        <div class="tab-strip" id="tab-strip"></div>
        <button class="new-tab" id="new-tab" aria-label="New tab" title="New tab">+</button>
        <div class="tab-search-menu" id="tab-search-menu" hidden></div>
        <div class="window-controls" aria-label="Window controls">
          <button id="minimize-window" aria-label="Minimize"></button>
          <button id="maximize-window" aria-label="Maximize"></button>
          <button id="close-window" aria-label="Close"></button>
        </div>
      </header>

      <div class="toolbar">
        <button class="toolbar-button" id="go-back" aria-label="Back" title="Back"><svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5M8.5 12h8.5"></path></svg></button>
        <button class="toolbar-button muted" id="go-forward" aria-label="Forward" title="Forward"><svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5M15.5 12H7"></path></svg></button>
        <button class="toolbar-button" id="reload-page" aria-label="Reload" title="Reload"><svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 9A8 8 0 1 0 20 14"></path><path d="M19.5 4.5V9H15"></path></svg></button>
        <form class="address-form" id="address-form">
          <span class="site-icon" aria-hidden="true">T</span>
          <input id="address-input" aria-label="Address and search bar" autocomplete="off" spellcheck="false" />
          <button class="address-action" id="bookmark-page" type="button" aria-label="Bookmark page" title="Bookmark page"><svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9L12 3.5Z"></path></svg></button>
        </form>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="toolbar-button" id="extensions" aria-label="Extensions" title="Extensions"><svg class="toolbar-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h4v3a2 2 0 1 0 4 0V4h4v4h-3a2 2 0 1 0 0 4h3v4h-4v-3a2 2 0 1 0-4 0v3H8v-4h3a2 2 0 1 0 0-4H8V4Z"></path></svg></button>
        <button class="toolbar-button profile profile-guest" id="profile" aria-label="Guest profile" title="Guest profile"></button>
        <button class="toolbar-button" id="browser-menu" aria-label="Menu" title="Menu"><svg class="toolbar-icon toolbar-menu-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg></button>
      </div>

      <nav class="market-ticker" id="market-ticker" aria-label="Market ticker">
        <div class="market-ticker-track" id="market-ticker-track"></div>
      </nav>

      <div class="page-shell" id="page-shell">
        <aside class="ads-sidebar" id="ads-sidebar" aria-label="Sponsored content">
          <div class="ads-sidebar-header">
            <span class="ads-sidebar-title">Sponsored</span>
            <button class="ads-sidebar-toggle" id="ads-sidebar-toggle" type="button" aria-label="Minimise ads sidebar" title="Minimise ads sidebar" aria-controls="ads-sidebar" aria-expanded="true"><span aria-hidden="true"></span></button>
          </div>
          <div class="ads-sidebar-body" data-ad-slot="left-rail">
            <div class="ads-sidebar-placeholder">
              <span class="ads-sidebar-placeholder-label">Ad space</span>
              <span class="ads-sidebar-placeholder-copy">Sponsored content will appear here.</span>
            </div>
          </div>
        </aside>
        <main class="browser-content" id="browser-content" aria-label="Browser pages"></main>
      </div>
    </div>
    <script src="./chat.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
